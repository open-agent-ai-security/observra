name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[test,otel,adk]"

      - name: Run tests
        run: pytest tests/unit/ -x --tb=short

  test-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install all stable extras
        run: pip install -e ".[test,otel,adk,langchain,pydantic-ai,claude,openai-agents]"

      - name: Run tests
        run: pytest tests/unit/ -x --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  docs-freshness:
    # Regenerate the GitHub Pages site (guide/, sitemap.xml) from docs/ and fail
    # if the committed output is stale — i.e. docs/*.md changed, or a page was
    # added/removed, without re-running docs_build.py. markdown is pinned in
    # requirements-dev.txt so a fresh build is byte-for-byte reproducible.
    # sitemap.xml is generated by the same script from the same PAGES list, so
    # it drifts under the same conditions guide/ does. See RFE #25.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs build deps
        run: pip install -r requirements-dev.txt

      - name: Rebuild the docs site
        run: python docs_build.py

      - name: Check guide/ and sitemap.xml are in sync with docs/
        run: |
          if [ -n "$(git status --porcelain -- guide/ sitemap.xml)" ]; then
            echo "::error::guide/ or sitemap.xml is out of sync with docs/. Run 'pip install -r requirements-dev.txt && python docs_build.py' and commit the regenerated output."
            git status --porcelain -- guide/ sitemap.xml
            git diff -- guide/ sitemap.xml
            exit 1
          fi
          echo "guide/ and sitemap.xml are up to date with docs/."

  api-docs-freshness:
    # NON-BLOCKING (continue-on-error): regenerate the pdoc API reference
    # (guide/api/) and report if it drifted from the docstrings — WITHOUT failing
    # the run. The pdoc pipeline (`make api-docs`) is newer than the markdown
    # docs-freshness gate above, so this stays informational for now: a stale
    # build surfaces as a red job + a warning annotation but does not fail CI.
    # Promote to a hard gate later by deleting `continue-on-error`. See RFE #25 / #63.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regenerate the API reference (pdoc, pinned)
        run: make api-docs

      - name: Check guide/api/ is in sync with the docstrings
        run: |
          if [ -n "$(git status --porcelain -- guide/api/)" ]; then
            echo "::warning::guide/api/ is out of sync with the docstrings — run 'make api-docs' and commit guide/api/."
            git status --porcelain -- guide/api/
            git diff --stat -- guide/api/
            exit 1
          fi
          echo "guide/api/ is up to date with the docstrings."
