name: CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[test,otel,adk]"

      - name: Run tests
        run: pytest tests/unit/ -x --tb=short

  test-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install all stable extras
        run: pip install -e ".[test,otel,adk,langchain,pydantic-ai,claude,openai-agents]"

      - name: Run tests
        run: pytest tests/unit/ -x --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  # NOTE: there is deliberately no per-PR docs-freshness gate. observra is a
  # versioned PyPI library, and the GitHub Pages docs (guide/ + sitemap.xml,
  # and guide/api/) track *releases*, not `main` — so between releases `main`'s
  # docs/*.md may legitimately be ahead of the published guide/. Both artifacts
  # are republished from the latest tag by the "Rebuild docs" workflow
  # (.github/workflows/rebuild-docs.yaml) — chained automatically by Auto Release
  # after a release, and runnable on demand — so the site never advertises
  # unreleased APIs. Gating guide/ against `main` per-PR would force publishing
  # unreleased-feature docs early — the opposite of what we want. See
  # CONTRIBUTING.md ("Docs") and #25.
