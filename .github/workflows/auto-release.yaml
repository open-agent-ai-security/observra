name: Auto Release

on:
  push:
    branches: [main]
    paths:
      - "src/observra/__init__.py" # the single source of truth for the version
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      # 'true' only when this run actually cut a new release (tag didn't exist).
      created: ${{ steps.check.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Extract version from src/observra/__init__.py
        id: version
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/observra/__init__.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag already exists
        id: check
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: steps.check.outputs.created == 'true'
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false

  # Republish BOTH Pages doc artifacts from the freshly-tagged release, so the
  # docs site always matches the released package. Runs only when a new release
  # was cut. The reusable workflow builds from the latest tag (== the tag just
  # created above) and commits the rendered guide/ + guide/api/ + sitemap.xml to
  # main. Isolated from the release job so a docs hiccup never blocks the release.
  publish-docs:
    needs: release
    if: needs.release.outputs.created == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/rebuild-docs.yaml
