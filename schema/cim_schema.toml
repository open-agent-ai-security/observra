[meta]
version = "1.0"
description = "CIM single source of truth for agent-telemetry v5.0"
product_id = "observra"

# event_type → action + terminal + default_result
[actions]
[actions.session_start]
action = "start_session"
terminal = false

[actions.session_end]
action = "end_session"
terminal = false

[actions.mcp_session_start]
action = "start_session"
terminal = false

[actions.mcp_session_end]
action = "end_session"
terminal = false

[actions.user]
action = "prompt_submit"
terminal = false

[actions.user_message]
action = "prompt_submit"
terminal = false

[actions.model_request]
action = "call_llm"
terminal = false

[actions.model_response]
action = "call_llm"
terminal = true
default_result = "success"

[actions.model_error]
action = "call_llm"
terminal = true
default_result = "failure"

[actions.turn]
action = "call_llm"
terminal = true
default_result = "success"

[actions.turn_duration]
action = "call_llm"
terminal = false

[actions.compact_boundary]
action = "compact_context"
terminal = false

[actions.tool_start]
action = "tool_call"
terminal = false

[actions.tool_end]
action = "tool_call"
terminal = true
default_result = "success"

[actions.tool_error]
action = "tool_call"
terminal = true
default_result = "failure"

[actions.agent_start]
action = "invoke_agent"
terminal = false

[actions.agent_end]
action = "invoke_agent"
terminal = true
default_result = "success"

[actions.agent_handoff]
action = "invoke_agent"
terminal = false

[actions.agent_handoff_error]
action = "invoke_agent"
terminal = true
default_result = "failure"

[actions.skill_invocation]
action = "tool_call"
terminal = false

[actions.stream_event]
action = "call_llm"
terminal = false

[actions.adapter_close]
action = "end_session"
terminal = false

[actions.cost_threshold_exceeded]
action = "policy_event"
terminal = false

[actions.depth_exceeded]
action = "policy_event"
terminal = false

# Update telemetry
[actions.forwarder_update_available]
action = "update_available"
terminal = false

[actions.forwarder_updated]
action = "update_applied"
terminal = false

[actions.forwarder_update_failed]
action = "update_failed"
terminal = false

# finish_reason mapping: raw → canonical enum
[[finish_reason]]
raw = "stop"
canonical = "stop"

[[finish_reason]]
raw = "tool_calls"
canonical = "tool_call"

[[finish_reason]]
raw = "function_call"
canonical = "tool_call"

[[finish_reason]]
raw = "length"
canonical = "max_tokens"

[[finish_reason]]
raw = "content_filter"
canonical = "content_filter"

[[finish_reason]]
raw = "end_turn"
canonical = "stop"

[[finish_reason]]
raw = "tool_use"
canonical = "tool_call"

[[finish_reason]]
raw = "max_tokens"
canonical = "max_tokens"

[[finish_reason]]
raw = "stop_sequence"
canonical = "stop"

[[finish_reason]]
raw = "STOP"
canonical = "stop"

[[finish_reason]]
raw = "MAX_TOKENS"
canonical = "max_tokens"

[[finish_reason]]
raw = "SAFETY"
canonical = "content_filter"

[[finish_reason]]
raw = "RECITATION"
canonical = "content_filter"

[[finish_reason]]
raw = "FINISH_REASON_STOP"
canonical = "stop"

[[finish_reason]]
raw = "FINISH_REASON_MAX_TOKENS"
canonical = "max_tokens"

[[finish_reason]]
raw = "finished"
canonical = "stop"

[[finish_reason]]
raw = "filtered"
canonical = "content_filter"

# vendor classification by model name substring
[[vendor_map]]
patterns = ["claude", "anthropic"]
vendor = "anthropic"

[[vendor_map]]
patterns = ["gpt", "o1", "o3", "openai"]
vendor = "openai"

[[vendor_map]]
patterns = ["gemini", "google", "vertex"]
vendor = "google"

[[vendor_map]]
patterns = ["copilot"]
vendor = "microsoft"

# framework → vendor fallback
[[framework_vendor]]
framework = "claude"
vendor = "anthropic"

[[framework_vendor]]
framework = "claude_code"
vendor = "anthropic"

[[framework_vendor]]
framework = "openai"
vendor = "openai"

[[framework_vendor]]
framework = "codex_cli"
vendor = "openai"

[[framework_vendor]]
framework = "codex_app"
vendor = "openai"

[[framework_vendor]]
framework = "gemini_cli"
vendor = "google"

[[framework_vendor]]
framework = "copilot"
vendor = "microsoft"

# reversibility classification patterns
[reversibility]
irreversible = [
  "delete", "drop", "truncate", "remove", "destroy",
  "send_email", "send_message", "publish", "post",
  "transfer", "pay", "charge", "deploy",
  "overwrite", "format", "wipe",
]
reversible = [
  "read", "get", "fetch", "list", "search", "query",
  "draft", "preview", "analyze", "summarize",
]

