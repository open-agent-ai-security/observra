[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "observra"
version = "1.0.2"
description = "Framework-agnostic agent behavior analytics — CIM-based telemetry for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Exabeam", email = "developer@exabeam.com" },
    { name = "Open Agent AI Security Contributors" },
]
keywords = ["agent", "telemetry", "observability", "llm", "ai", "cim"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "python-ulid>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/open-agent-ai-security/observra"
Repository = "https://github.com/open-agent-ai-security/observra"
Issues = "https://github.com/open-agent-ai-security/observra/issues"

[project.optional-dependencies]
# --- v1.0 supported extras ---
adk = [
    "google-adk>=1.0.0",
]
claude = [
    "claude-agent-sdk>=0.1.37",
    "tiktoken>=0.7.0",
]
openai-agents = [
    "openai-agents>=0.9.0",
]
langchain = [
    "langchain-core>=1.0.0",
    "langgraph>=0.2.0",
]
pydantic-ai = [
    "pydantic-ai<2.0.0",
    "opentelemetry-sdk>=1.0.0",
]

otel = [
    "opentelemetry-sdk>=1.0.0",
    "opentelemetry-exporter-otlp-proto-http>=1.0.0",
]
exabeam = [
    "requests>=2.32.0",
]
safe-regex = [
    "google-re2>=1.1",
]
encryption = [
    "cryptography>=41.0",
]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.0",
    "pytest-benchmark>=5.1",
]
all = [
    "observra[adk,claude,openai-agents,langchain,pydantic-ai,otel,exabeam,encryption,safe-regex]",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["observra*"]

[tool.setuptools.package-data]
observra = ["pricing/*.json", "adapters/adk/pricing.json", "adapters/claude/pricing.json", "adapters/openai/pricing.json", "adapters/langchain/pricing.json", "adapters/pydantic_ai/pricing.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/observra/adapters"]
norecursedirs = ["tests/load", "tests/property", "tests/benchmarks", "tests/uat"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--import-mode=importlib",
    "--benchmark-disable",
]
filterwarnings = ["default::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
